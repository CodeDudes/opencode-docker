services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: ocd-bifrost-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - BIFROST_ENVIRONMENT=production
      - BIFROST_CONFIG_PATH=/app/config.json
    env_file:
      - path: .env.bifrost
        required: false
